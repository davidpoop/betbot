# Configuración por defecto del MVP. Todos los umbrales de selección están
# pre-registrados aquí; solo se revisan en fechas fijas, nunca tras ver resultados.
paths:
  raw_dir: data/raw
  canonical_dir: data/canonical
  manual_dir: data/manual        # rankings y otros ficheros introducidos a mano
  artifacts_dir: artifacts
  reports_dir: artifacts/reports
  ledger_dir: artifacts/ledger
  exports_dir: artifacts/exports

rankings:
  max_age_days: 45               # aviso si el ranking cargado es mas viejo

feeds:
  # SOLO fuentes AUTORITATIVAS (con estado + hora de inicio + id de evento) pueden
  # crear un partido elegible. github_te NO lo es: queda solo como fuente de cuotas.
  # Orden de calendarios AUTORITATIVOS. wta_official (primera parte, WTA) y
  # oddsapi (/events con BETBOT_ODDS_API_KEY: la via ATP operativa) primero;
  # thesportsdb respaldo best-effort; espn DEGRADADO al final (403 sistematico
  # observado tambien desde conexiones domesticas); sportradar opcional con key.
  calendar_order: [wta_official, oddsapi, thesportsdb, espn, sportradar]
  thesportsdb_key: "3"              # clave PÚBLICA de su documentación (sin alta ni secreto)
  # Odds-API.io: SOLO sondeo por ahora (betbot feeds oddsapiio-probe). No es
  # fuente de cuotas del escaner hasta que el sondeo demuestre cobertura real.
  # La clave va exclusivamente en la variable de entorno ODDS_API_IO_KEY.
  oddsapiio:
    base_url: "https://api.odds-api.io/v3"
    daily_request_budget: 500
  odds_order: [github_te, espn, oddsapi]
  prematch_margin_minutes: 5        # margen de seguridad antes del comienzo
  calendar_status_max_age_hours: 6  # estado de calendario mas viejo -> no se analiza
  # contraste de la hora de inicio con fuentes independientes (The Odds API y
  # sus espejos publicos). Sin el, una hora placeholder podria colarse.
  commence_crosscheck: true
  commence_tolerance_minutes: 90    # discrepancia mayor -> conflicto_de_fuentes
  # Resultados: primaria reciente -> fallbacks. oddsapi_scores = The Odds API
  # /scores (solo ATP, cobertura PARCIAL por torneo; produce filas SOLO si el
  # payload trae marcador por sets — con el agregado documentado devuelve 0 y
  # nunca avanza la frescura global); wta_official = primera parte, mismo dia
  # (solo WTA); github = mirrors historicos (ATP diario via TML, WTA semanal);
  # sportradar opcional con SPORTRADAR_API_KEY (trial gratuito).
  # wta_official ANTES que sportradar a propósito: WTA lo mantiene de primaria
  # y sportradar queda de respaldo (ATP sí usa sportradar de primaria reciente).
  results_order: [oddsapi_scores, wta_official, sportradar, github]
  # Sportradar consciente de cuota (el trial es limitado). OPCIONAL: sin
  # suscripción queda INACTIVO_CONFIG y JAMÁS es requisito del producto.
  sportradar_replay_days: 2              # re-consulta D-1..D por correcciones tardías
  sportradar_max_requests_per_sync: 8    # tope de peticiones de red por sync;
                                         # superarlo exige `sync-results --backfill-atp`
  # The Odds API /scores para RECENT OUTCOMES (ganador+sets, outcome_only):
  # /sports es gratis (caché 24h); cada /scores con daysFrom = 2 créditos.
  # Con el tope: <= 2*max_sports créditos por sync sin caché (~8/día).
  oddsapi_scores_max_sports: 4
  structured_odds_order: [betfair]          # mercados de sets (catalogo dinamico, solo lectura)
  sync_max_days: 30                         # tope de backfill por ciclo de sync
  ttl_seconds: 900                          # caché de red
  odds_api_key: null                        # The Odds API (opcional; o BETBOT_ODDS_API_KEY)

paper:
  retirement_rule: "1_set"       # 1_set (Pinnacle/Betfair) | match_completed (bet365)

seed: 20260803

data:
  atp_years: [2000, 2026]
  wta_years: [2007, 2026]
  # Prioridad de casas para p_novig histórica (columna presente y ambas cuotas > 1.0)
  book_priority: [PS, B365, Avg, Max, TD1]

splits:
  train_end_year: 2022      # entrenamiento <= 2022
  valid_years: [2023, 2024] # seleccion de modelo/calibrador/umbrales
  test_year: 2025           # SELLADO: un unico acceso via 'betbot evaluate --test'
  walkforward_first_valid_year: 2013

elo:
  start_rating: 1500.0
  # K estilo FiveThirtyEight: K = k_base / (n_partidos + offset) ** shape
  k_base: 250.0
  k_offset: 5.0
  k_shape: 0.4

selection:
  # Estados de candidata (pre-registrados)
  ev_min: 0.03            # EV_cons minimo para candidata normal / experimental
  edge_min: 0.02          # edge minimo vs no-vig (mercados completos)
  ev_strong: 0.05         # candidata fuerte
  edge_strong: 0.03
  prob_likely: 0.60       # "evento probable sin value"
  odds_soft_range: [1.40, 4.00]  # fuera de rango -> aviso, no descarte
  odds_max_age_hours: 6.0
  # umbral por operador/fuente (cadencia real de publicacion; TE publica cada 6h)
  odds_max_age_hours_by_book: {TE: 8.0}
  z_sigma: 1.0            # p_rob = p - z*sigma (mercados parciales)
  shrink_w: null          # peso de shrinkage a mercado; si null se ajusta en validacion
  min_matches_12m: 5      # OOD: jugador con < N partidos en 12 meses
  layoff_days_ood: 90     # OOD: regreso tras lesion larga
  stale_days_unknown: 540 # sin partidos en este periodo -> jugador desconocido/retirado
  # si NUESTROS datos del circuito van con mas retraso que esto respecto al
  # partido, la falta de historial se marca data_freshness_unknown (aviso),
  # nunca como falso OOD del jugador
  freshness_lag_max_days: 14

markets:
  principal: [match_winner]
  experimental: [set1_winner, wins_set, straight_sets, three_sets, set_score]
