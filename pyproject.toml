[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betbot"
version = "0.1.0"
description = "Screener cuantitativo de apuestas de tenis (MVP local, sin ejecución de apuestas)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "click>=8.1",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
    "joblib>=1.3",
    "streamlit>=1.49",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
betbot = "betbot.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
